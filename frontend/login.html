<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masuk — Pemeriksaan Ruangan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script src="assets/js/config.js"></script>
  </head>
  <body>
    <div class="login-page">
      <section class="login-panel">
        <div class="login-box">
          <div class="system-name">RSU Dr. H. Koesnadi Bondowoso</div>
          <h2>Pemeriksaan Ruangan</h2>
          <p>Masuk untuk mengelola ruangan, pemeriksaan, dan laporan.</p>
          <div class="alert alert-info" style="font-size: 12px">
            Lingkungan development — data demo. Jangan gunakan untuk operasi produksi.
          </div>
          <form id="login-form">
            <div class="form-group mb-3 flex min-w-0 flex-col gap-1">
              <label for="email">Email *</label>
              <input id="email" name="email" type="email" required autocomplete="username" />
            </div>
            <div class="form-group mb-3 flex min-w-0 flex-col gap-1">
              <label for="password">Password *</label>
              <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
                value="0"
              />
            </div>
            <button
              class="btn inline-flex min-h-10 cursor-pointer items-center justify-center gap-1.5 rounded-lg border border-transparent bg-primary px-3.5 py-2 text-[13px] leading-snug font-semibold whitespace-nowrap text-white no-underline hover:bg-primary-hover hover:text-white hover:no-underline disabled:cursor-not-allowed disabled:opacity-55"
              type="submit"
              style="width: 100%"
            >
              Masuk
            </button>
            <p id="login-error" class="hidden error-text text-danger mt-2.5 text-[13px]"></p>
          </form>
        </div>
      </section>
    </div>
    <script type="module">
      import { login, getToken } from "./assets/js/api.js";
      import { toast } from "./assets/js/components/shell.js";

      if (getToken()) location.replace("pages/dashboard.html");

      document.querySelectorAll("[data-email]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.getElementById("email").value = btn.getAttribute("data-email");
          document.getElementById("password").value = "0";
        });
      });

      document.getElementById("login-form").addEventListener("submit", async (e) => {
        console.log("SUBMIT HANDLER FIRED");
        e.preventDefault();
        const fd = new FormData(e.target);
        const err = document.getElementById("login-error");
        err.classList.add("hidden");
        try {
          await login(String(fd.get("email")), String(fd.get("password")));
          toast("Login berhasil", "success");
          location.href = "pages/dashboard.html";
        } catch (ex) {
          err.textContent = ex.message || "Login gagal. Periksa email dan password.";
          err.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
